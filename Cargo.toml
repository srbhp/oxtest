[package]
name = "cobratest"
version = "0.1.0"
edition = "2021"
authors = ["Generated by GitHub Copilot"]
description = "Rust-powered Python test runner using PyO3"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
pyo3 = { version = "0.19", features = ["auto-initialize"] }
walkdir = "2.3"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globset = "0.4"

[dev-dependencies]
tempfile = "3.6"
